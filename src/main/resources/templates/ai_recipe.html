<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 冰箱守卫者</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      --secondary-gradient: linear-gradient(135deg, #00b894 0%, #55efc4 100%);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.6);
    }

    body {
      background-color: #dfe6e9;
      font-family: "Noto Sans SC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* === 1. 动态背景光斑 === */
    .background-blobs {
      position: absolute; width: 100%; height: 100%; z-index: -1;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6;
      animation: float 15s infinite ease-in-out;
    }
    .blob-1 { top: -10%; left: -10%; width: 600px; height: 600px; background: #a29bfe; }
    .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #74b9ff; animation-delay: 2s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(50px, -50px); }
    }

    /* === 2. 核心容器 === */
    .container-box {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      width: 850px;
      max-width: 100%;
      min-height: 550px;
      border: 1px solid var(--glass-border);
    }

    /* === 3. 表单区域布局 === */
    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all 0.6s ease-in-out;
    }

    .sign-in-container {
      left: 0;
      width: 50%;
      z-index: 2;
    }

    .container-box.right-panel-active .sign-in-container {
      transform: translateX(100%);
    }

    .sign-up-container {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
    }

    .container-box.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
      animation: show 0.6s;
    }

    @keyframes show {
      0%, 49.99% { opacity: 0; z-index: 1; }
      50%, 100% { opacity: 1; z-index: 5; }
    }

    /* === 4. 表单样式细节 === */
    form {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 50px;
      height: 100%;
      text-align: center;
    }

    h1 {
      font-weight: bold;
      margin: 0 0 20px;
      color: #2d3436;
    }

    .social-container {
      margin: 20px 0;
    }
    .social-container a {
      border: 1px solid #dfe6e9;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin: 0 5px;
      height: 40px;
      width: 40px;
      color: #636e72;
      text-decoration: none;
      transition: 0.3s;
    }
    .social-container a:hover {
      background: #fff;
      color: #6c5ce7;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .input-group-custom {
      position: relative;
      width: 100%;
      margin: 10px 0;
    }

    .input-group-custom i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #b2bec3;
      transition: 0.3s;
    }

    input {
      background-color: #f5f6fa;
      border: 2px solid transparent;
      padding: 12px 15px 12px 45px;
      width: 100%;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    input:focus {
      background-color: #fff;
      border-color: #6c5ce7;
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
    }
    input:focus + i { color: #6c5ce7; }

    .btn-grad {
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 45px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 80ms ease-in, box-shadow 0.3s;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
    }

    .btn-grad:active { transform: scale(0.95); }
    .btn-grad:hover { box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); }

    /* === 5. 覆盖层 (滑动部分) === */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 100;
    }

    .container-box.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      background: var(--primary-gradient);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: 0 0;
      color: #ffffff;
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .container-box.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 40px;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .container-box.right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .container-box.right-panel-active .overlay-right {
      transform: translateX(20%);
    }

    .btn-ghost {
      background-color: transparent;
      border-color: #ffffff;
      border: 1px solid #fff;
      color: white;
      border-radius: 50px;
      padding: 12px 45px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 20px;
      transition: 0.3s;
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.2);
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .container-box { min-height: 600px; width: 95%; }
      .form-container { width: 100%; }
      .overlay-container { display: none; } /* 移动端隐藏动画，改为简单切换逻辑 */
      .sign-in-container { width: 100%; z-index: 5; }
      .sign-up-container { width: 100%; display: none; }
      .container-box.mobile-toggle .sign-in-container { display: none; }
      .container-box.mobile-toggle .sign-up-container { display: flex; opacity: 1; z-index: 5; }
    }
  </style>
</head>
<body>

<div class="background-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="container-box" id="container">
  <div class="form-container sign-up-container">
    <form onsubmit="doRegister(event)">
      <h1>创建账户</h1>
      <div class="social-container">
        <a href="#" class="social"><i class="bi bi-wechat"></i></a>
        <a href="#" class="social"><i class="bi bi-github"></i></a>
      </div>
      <span class="small text-muted mb-3">填写以下信息完成注册</span>

      <div class="input-group-custom">
        <input type="text" id="r_username" placeholder="用户名" required />
        <i class="bi bi-person"></i>
      </div>
      <div class="input-group-custom">
        <input type="email" id="r_email" placeholder="邮箱 (选填)" />
        <i class="bi bi-envelope"></i>
      </div>
      <div class="input-group-custom">
        <input type="password" id="r_password" placeholder="密码" required />
        <i class="bi bi-lock"></i>
      </div>

      <button class="btn-grad">立即注册</button>
      <button type="button" class="btn btn-link text-muted d-md-none mt-3" onclick="toggleMobile()">已有账号？去登录</button>
    </form>
  </div>

  <div class="form-container sign-in-container">
    <form onsubmit="doLogin(event)">
      <h1 class="mb-2">欢迎回来</h1>
      <p class="text-muted small mb-4">Fridge Guardian 冰箱守卫者</p>

      <div class="input-group-custom">
        <input type="text" id="l_username" placeholder="用户名" required />
        <i class="bi bi-person"></i>
      </div>
      <div class="input-group-custom">
        <input type="password" id="l_password" placeholder="密码" required />
        <i class="bi bi-lock"></i>
      </div>
      <div class="text-end w-100 mb-3">
        <a href="#" class="text-muted small text-decoration-none">忘记密码?</a>
      </div>

      <button class="btn-grad">登录系统</button>
      <button type="button" class="btn btn-link text-muted d-md-none mt-3" onclick="toggleMobile()">没有账号？去注册</button>
    </form>
  </div>

  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1 class="text-white">已有账号？</h1>
        <p>请使用您的个人信息登录，继续管理您的食材库</p>
        <button class="btn-ghost" id="signIn">去登录</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1 class="text-white">新朋友？</h1>
        <p>立即注册加入我们，开始智能管理您的冰箱生活</p>
        <button class="btn-ghost" id="signUp">去注册</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "/api/auth";
  const container = document.getElementById('container');
  const signUpBtn = document.getElementById('signUp');
  const signInBtn = document.getElementById('signIn');

  // 切换动画逻辑
  signUpBtn.addEventListener('click', () => {
    container.classList.add("right-panel-active");
  });

  signInBtn.addEventListener('click', () => {
    container.classList.remove("right-panel-active");
  });

  // 移动端切换逻辑
  function toggleMobile() {
    if (window.innerWidth <= 768) {
      container.classList.toggle("mobile-toggle");
    } else {
      container.classList.toggle("right-panel-active");
    }
  }

  // 登录逻辑
  async function doLogin(e) {
    e.preventDefault();
    // 加载状态反馈
    const btn = e.target.querySelector('button[type="submit"]');
    const originalText = btn.innerText;
    btn.innerText = "登录中...";
    btn.disabled = true;

    const username = document.getElementById("l_username").value;
    const password = document.getElementById("l_password").value;

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const result = await res.json();
      if (result.code === 200) {
        localStorage.setItem("fg_token", result.data.token);
        localStorage.setItem("fg_user", result.data.username);
        btn.innerText = "登录成功!";
        setTimeout(() => window.location.href = "/", 500);
      } else {
        alert(result.message);
        resetBtn();
      }
    } catch (err) {
      alert("网络错误");
      resetBtn();
    }

    function resetBtn() {
      btn.innerText = originalText;
      btn.disabled = false;
    }
  }

  // 注册逻辑
  async function doRegister(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const originalText = btn.innerText;
    btn.innerText = "注册中...";
    btn.disabled = true;

    const username = document.getElementById("r_username").value;
    const password = document.getElementById("r_password").value;
    const email = document.getElementById("r_email").value;

    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, email })
      });
      const result = await res.json();
      if (result.code === 200) {
        alert("注册成功，请登录");
        // 自动切换回登录页
        if (window.innerWidth <= 768) {
          container.classList.remove("mobile-toggle");
        } else {
          container.classList.remove("right-panel-active");
        }
        // 清空输入框
        e.target.reset();
      } else {
        alert(result.message);
      }
    } catch (err) { alert("网络错误"); }

    btn.innerText = originalText;
    btn.disabled = false;
  }
</script>
</body>
</html>
