<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>AI 智能食谱生成</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/ai_recipe.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/index">
      <i class="bi bi-snow2 me-2"></i>冰箱守卫者
    </a>
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="openConfigModal()">
        <i class="bi bi-gear-fill me-1"></i> 模型设置
      </button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-white py-3">
          <h5 class="card-title mb-0 fw-bold text-primary">
            <i class="bi bi-basket me-2"></i>选择食材
          </h5>
        </div>
        <div class="card-body">
          <div class="input-group mb-3">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" id="foodSearch" class="form-control border-start-0 bg-light" placeholder="搜索食材...">
          </div>

          <div id="foodList" class="list-group list-group-flush overflow-auto mb-3" style="max-height: 400px;">
            <div class="text-center py-4 text-muted">
              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              <span class="ms-2">加载食材中...</span>
            </div>
          </div>

          <button onclick="generateRecipe()" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm transition-btn">
            <i class="bi bi-stars me-1"></i> 生成 AI 食谱
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card border-0 shadow-sm h-100 d-flex flex-column">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0 fw-bold text-primary">
            <i class="bi bi-chat-square-text me-2"></i>AI 厨师助手
          </h5>
          <button onclick="clearHistory()" class="btn btn-outline-secondary btn-sm rounded-pill" title="清除记忆">
            <i class="bi bi-trash3"></i>
          </button>
        </div>

        <div id="chatHistory" class="card-body overflow-auto flex-grow-1 bg-light" style="min-height: 400px; max-height: 600px;">
          <div class="text-center text-muted mt-5">
            <i class="bi bi-robot fs-1 d-block mb-3"></i>
            <p>请在左侧选择食材，点击生成食谱</p>
          </div>
        </div>

        <div class="card-footer bg-white p-3" id="inputArea" style="display: none;">
          <div class="input-group">
            <input type="text" id="userMessage" class="form-control rounded-pill bg-light border-0 px-3"
                   placeholder="对食谱不满意？比如：'太辣了' 或 '把猪肉换成牛肉'..."
                   onkeypress="if(event.keyCode==13) sendMessage()">
            <button class="btn btn-primary rounded-pill ms-2 px-4" onclick="sendMessage()">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="aiConfigModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
      <div class="modal-header border-0 bg-primary text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-cpu me-2"></i>配置 AI 引擎</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="alert alert-light border small text-muted mb-4">
          <i class="bi bi-info-circle me-1"></i> 初次使用或切换模型时需配置。密钥将加密存储。
        </div>

        <form id="configForm">
          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">选择模型厂商</label>
            <select class="form-select" id="config-engine" onchange="updateDefaultConfig()">
              <option value="DeepSeek" selected>DeepSeek (深度求索)</option>
              <option value="Qwen">Alibaba Qwen (通义千问)</option>
              <option value="OpenAI">OpenAI (GPT-3.5/4)</option>
              <option value="Custom">自定义 (OpenAI 兼容)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">API Key (密钥)</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
              <input type="password" id="config-key" class="form-control border-start-0" placeholder="sk-..." required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Base URL (接口地址)</label>
            <input type="text" id="config-url" class="form-control" placeholder="https://..." required>
            <div class="form-text small text-muted">无需包含 /chat/completions 后缀</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Model Name (模型名称)</label>
            <input type="text" id="config-model" class="form-control" placeholder="例如: deepseek-chat" required>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 p-3 bg-light rounded-bottom">
        <button type="button" class="btn btn-primary w-100 rounded-pill fw-bold" onclick="saveAiConfig()">
          保存并使用
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script th:src="@{/js/ai_recipe.js}"></script>
</body>
</html>
