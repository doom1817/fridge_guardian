<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能食谱 - 冰箱守卫者</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/index.css" rel="stylesheet">
  <link th:href="@{/css/ai_recipe.css}" rel="stylesheet">

  <style>
    /* 针对 AI 页面的微调 */
    .glass-card {
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 防止圆角溢出 */
    }
    /* 自定义滚动条适配毛玻璃 */
    .overflow-auto::-webkit-scrollbar {
      width: 6px;
    }
    .overflow-auto::-webkit-scrollbar-thumb {
      background-color: rgba(0,0,0,0.1);
      border-radius: 3px;
    }
    /* 导航栏适配 */
    .glass-nav {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

<div class="background-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<nav class="navbar navbar-expand-lg fixed-top glass-nav">
  <div class="container">
    <a class="navbar-brand fw-bold app-title mb-0" href="/" style="font-size: 1.5rem;">
      <i class="bi bi-snow2 me-2"></i>冰箱守卫者
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-sm btn-link text-decoration-none text-secondary fw-bold">
        <i class="bi bi-arrow-left"></i> 返回首页
      </a>
      <button class="btn btn-sm glass-pill border-0 shadow-sm text-primary fw-bold" onclick="openConfigModal()">
        <i class="bi bi-gear-fill me-1"></i> 模型设置
      </button>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 80px; height: calc(100vh - 100px);">
  <div class="row g-4 h-100 pb-4">

    <div class="col-md-4 h-100">
      <div class="glass-card p-0 h-100 animate-enter delay-1">
        <div class="p-3 border-bottom border-light bg-white bg-opacity-25">
          <h5 class="mb-0 fw-bold text-dark">
            <i class="bi bi-basket-fill me-2 text-primary"></i>我的食材
          </h5>
        </div>

        <div class="p-3 flex-grow-0">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" id="foodSearch" class="form-control bg-transparent border-start-0" placeholder="搜索库存...">
          </div>
        </div>

        <div id="foodList" class="list-group list-group-flush overflow-auto p-2 flex-grow-1">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <p class="mt-2 small">正在同步冰箱数据...</p>
          </div>
        </div>

        <div class="p-3 border-top border-light bg-white bg-opacity-25">
          <button onclick="generateRecipe()" class="btn btn-primary btn-glow w-100 bg-gradient-teal border-0 shadow-sm py-2">
            <i class="bi bi-stars me-1"></i> 生成 AI 食谱
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-8 h-100">
      <div class="glass-card p-0 h-100 animate-enter delay-2">
        <div class="p-3 border-bottom border-light bg-white bg-opacity-25 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold text-dark">
            <i class="bi bi-chat-dots-fill me-2 text-success"></i>AI 厨师助手
          </h5>
          <button onclick="clearHistory()" class="btn btn-sm btn-outline-danger rounded-pill border-0" title="清空对话">
            <i class="bi bi-trash3"></i>
          </button>
        </div>

        <div id="chatHistory" class="p-4 overflow-auto flex-grow-1" style="background: rgba(255,255,255,0.3);">
          <div class="text-center text-muted mt-5 opacity-75">
            <i class="bi bi-robot fs-1 d-block mb-3"></i>
            <p>👈 请在左侧勾选食材，点击“生成食谱”</p>
            <small>支持 DeepSeek / Qwen / OpenAI 等模型</small>
          </div>
        </div>

        <div class="p-3 border-top border-light bg-white bg-opacity-50" id="inputArea" style="display: none;">
          <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white">
            <input type="text" id="userMessage" class="form-control border-0 px-4 py-2"
                   placeholder="觉得太淡了？或者想换种做法？直接告诉我..."
                   onkeypress="if(event.keyCode==13) sendMessage()">
            <button class="btn btn-primary px-4 border-0 bg-gradient-blue" onclick="sendMessage()">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="aiConfigModal" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="glass-card p-0 border-0" style="pointer-events: auto;">
      <div class="modal-header border-0 bg-gradient-blue text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-cpu me-2"></i>配置 AI 引擎</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 bg-white bg-opacity-75">
        <form id="configForm">
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">模型厂商</label>
            <select class="form-select rounded-3 cursor-pointer" id="config-engine" onchange="updateDefaultConfig()">
              <option value="DeepSeek" selected>DeepSeek</option>
              <option value="Qwen">通义千问 (Qwen)</option>
              <option value="OpenAI">OpenAI (GPT-3.5/4)</option>
              <option value="Custom">自定义</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">API Key</label>
            <input type="password" id="config-key" class="form-control rounded-3" placeholder="sk-..." required>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">Base URL</label>
            <input type="text" id="config-url" class="form-control rounded-3" required>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">Model Name</label>
            <input type="text" id="config-model" class="form-control rounded-3" required>
          </div>
          <button type="button" class="btn btn-primary btn-glow w-100 bg-gradient-blue border-0 mt-2" onclick="saveAiConfig()">
            保存配置
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script th:src="@{/js/ai_recipe.js}"></script>
</body>
</html>
