<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能食谱 - 冰箱守卫者</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/index.css" rel="stylesheet">
  <link href="/css/ai_recipe.css" rel="stylesheet">
  <style>
    .glass-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .overflow-auto::-webkit-scrollbar {
      width: 6px;
    }

    .overflow-auto::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
<div class="background-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<nav class="navbar navbar-expand-lg fixed-top glass-nav">
  <div class="container">
    <a class="navbar-brand fw-bold app-title mb-0" href="/" style="font-size: 1.5rem;">
      <i class="bi bi-snow2 me-2"></i>冰箱守卫者
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-sm btn-link text-decoration-none text-secondary fw-bold">
        <i class="bi bi-arrow-left"></i> 返回首页
      </a>
      <button class="btn btn-sm glass-pill border-0 shadow-sm text-primary fw-bold" onclick="openConfigModal()">
        <i class="bi bi-gear-fill me-1"></i> 模型设置
      </button>
    </div>
  </div>
</nav>

<div class="container recipe-page-shell">
  <div class="row g-4 h-100 pb-4">
    <div class="col-md-4 h-100">
      <div class="glass-card p-0 h-100 animate-enter delay-1">
        <div class="p-3 border-bottom border-light bg-white bg-opacity-25">
          <h5 class="mb-0 fw-bold text-dark">
            <i class="bi bi-basket-fill me-2 text-primary"></i>我的食材
          </h5>
        </div>

        <div class="p-3 flex-grow-0">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" id="foodSearch" class="form-control bg-transparent border-start-0" placeholder="搜索库存...">
          </div>
        </div>

        <div id="foodList" class="list-group list-group-flush overflow-auto p-2 flex-grow-1">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <p class="mt-2 small">正在同步冰箱数据...</p>
          </div>
        </div>

        <div class="p-3 border-top border-light bg-white bg-opacity-25">
          <div class="d-grid gap-2">
            <button onclick="generateRecipe()" class="btn btn-primary btn-glow w-100 bg-gradient-teal border-0 shadow-sm py-2">
              <i class="bi bi-stars me-1"></i> 生成 AI 食谱
            </button>
            <button id="regenerateButton" onclick="regenerateRecipe()" class="btn btn-light border-0 shadow-sm py-2 text-primary fw-bold" style="display: none;">
              <i class="bi bi-arrow-repeat me-1"></i> 同样食材再来一道
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-8 h-100">
      <div class="glass-card p-0 h-100 animate-enter delay-2">
        <div class="p-3 border-bottom border-light bg-white bg-opacity-25 d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-0 fw-bold text-dark">
              <i class="bi bi-chat-dots-fill me-2 text-success"></i>AI 厨师助手
            </h5>
            <small class="text-muted">先选食材，再让 AI 给你一份更贴合库存的做法</small>
          </div>
          <button onclick="clearHistory()" class="btn btn-sm btn-outline-danger rounded-pill border-0" title="清空对话">
            <i class="bi bi-trash3"></i>
          </button>
        </div>

        <div id="chatHistory" class="p-4 overflow-auto flex-grow-1">
          <div class="text-center text-muted mt-5 opacity-75">
            <i class="bi bi-robot fs-1 d-block mb-3"></i>
            <p>请在左侧勾选食材，点击“生成食谱”</p>
            <small>支持 DeepSeek / Qwen / OpenAI 等模型</small>
          </div>
        </div>

        <div class="px-3 pt-3 bg-white bg-opacity-50 border-top border-light" id="quickActions" style="display: none;">
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm quick-action-btn" onclick="sendQuickPrompt('换一个更快的做法')">更快做法</button>
            <button type="button" class="btn btn-sm quick-action-btn" onclick="sendQuickPrompt('更适合减脂')">减脂友好</button>
            <button type="button" class="btn btn-sm quick-action-btn" onclick="sendQuickPrompt('更清淡一点')">更清淡些</button>
            <button type="button" class="btn btn-sm quick-action-btn" onclick="sendQuickPrompt('优先消耗临期食材')">优先临期</button>
            <button type="button" class="btn btn-sm quick-action-btn" onclick="sendQuickPrompt('把步骤再简化一点')">步骤更简</button>
          </div>

          <div id="feedbackPanel" class="feedback-panel mt-3" style="display: none;">
            <div class="feedback-label">这次推荐怎么样？</div>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-sm feedback-btn feedback-good" onclick="submitRecipeFeedback('HELPFUL')">
                <i class="bi bi-hand-thumbs-up me-1"></i> 有帮助
              </button>
              <button type="button" class="btn btn-sm feedback-btn feedback-bad" onclick="openFeedbackModal()">
                <i class="bi bi-hand-thumbs-down me-1"></i> 不太合适
              </button>
            </div>
            <div id="feedbackHint" class="feedback-hint mt-2"></div>
          </div>
        </div>

        <div class="p-3 border-top-0 bg-white bg-opacity-50" id="inputArea" style="display: none;">
          <div class="chat-compose-shell">
            <input type="text" id="userMessage" class="chat-compose-input"
                   placeholder="觉得太淡了？或者想换种做法？直接告诉我..."
                   onkeypress="if(event.keyCode===13) sendMessage()">
            <button class="chat-send-btn" onclick="sendMessage()" aria-label="发送消息" title="发送消息">
              <i class="bi bi-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="aiConfigModal" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="glass-card p-0 border-0" style="pointer-events: auto;">
      <div class="modal-header border-0 bg-gradient-blue text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-cpu me-2"></i>配置 AI 引擎</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 bg-white bg-opacity-75">
        <form id="configForm">
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">模型厂商</label>
            <select class="form-select rounded-3 cursor-pointer" id="config-engine" onchange="updateDefaultConfig()">
              <option value="DeepSeek" selected>DeepSeek</option>
              <option value="Qwen">通义千问 (Qwen)</option>
              <option value="OpenAI">OpenAI (GPT-3.5/4)</option>
              <option value="Custom">自定义</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">API Key</label>
            <input type="password" id="config-key" class="form-control rounded-3" placeholder="sk-..." required>
            <small class="text-muted d-block mt-1">已保存的 Key 会以脱敏形式展示；不修改可直接保留。</small>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">Base URL</label>
            <input type="text" id="config-url" class="form-control rounded-3" required>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">Model Name</label>
            <input type="text" id="config-model" class="form-control rounded-3" required>
          </div>

          <hr class="my-4">

          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">口味偏好</label>
            <select class="form-select rounded-3" id="config-taste">
              <option value="">默认即可</option>
              <option value="清淡">清淡</option>
              <option value="家常">家常</option>
              <option value="香辣">香辣</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">饮食目标</label>
            <select class="form-select rounded-3" id="config-goal">
              <option value="">默认即可</option>
              <option value="普通">普通</option>
              <option value="减脂">减脂</option>
              <option value="增肌">增肌</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">忌口说明</label>
            <input type="text" id="config-taboos" class="form-control rounded-3" placeholder="例如：不吃辣、海鲜过敏">
          </div>
          <div class="mb-3">
            <label class="small text-muted fw-bold mb-1">烹饪时长偏好</label>
            <select class="form-select rounded-3" id="config-time">
              <option value="">默认即可</option>
              <option value="10分钟内">10分钟内</option>
              <option value="20分钟左右">20分钟左右</option>
              <option value="40分钟内">40分钟内</option>
            </select>
          </div>

          <button type="button" class="btn btn-primary btn-glow w-100 bg-gradient-blue border-0 mt-2" onclick="saveAiConfig()">
            保存配置
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="feedbackReasonModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content feedback-modal">
      <div class="modal-header border-0 pb-2">
        <div>
          <h5 class="modal-title fw-bold mb-1">哪里不太合适？</h5>
          <small class="text-muted">选一个最接近的原因，也可以补一句说明。</small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <div class="feedback-reason-grid">
          <button type="button" class="feedback-reason-pill" data-reason="太复杂">太复杂</button>
          <button type="button" class="feedback-reason-pill" data-reason="食材不贴合">食材不贴合</button>
          <button type="button" class="feedback-reason-pill" data-reason="口味不合适">口味不合适</button>
          <button type="button" class="feedback-reason-pill" data-reason="不够实用">不够实用</button>
        </div>
        <textarea id="feedbackReasonInput" class="form-control feedback-textarea mt-3" rows="4" placeholder="补充一点你的感觉，比如“想更简单一点”"></textarea>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" onclick="submitNegativeFeedback()">提交反馈</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/expiring_alert.js"></script>
<script src="/js/ai_recipe.js"></script>
</body>
</html>
