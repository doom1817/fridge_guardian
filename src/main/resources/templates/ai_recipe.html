<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 灵感配餐 - 冰箱守卫者</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="/css/ai_recipe.css" rel="stylesheet" />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <div class="main-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-dark">
          <i class="bi bi-stars text-success me-2"></i>AI 灵感配餐
        </h2>
        <a href="/" class="btn btn-light rounded-pill px-4 shadow-sm fw-bold">
          <i class="bi bi-house-door me-1"></i> 返回首页
        </a>
      </div>

      <div class="row g-4" style="min-height: 650px">
        <div class="col-lg-4">
          <div class="glass-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">步骤 1: 勾选食材</h5>
              <span class="badge bg-white text-secondary border">我的库存</span>
            </div>

            <div id="foodSelectionList" class="ingredient-list">
              <div class="text-center py-4 text-muted small">
                <div
                  class="spinner-border spinner-border-sm text-secondary"
                ></div>
                正在读取冰箱...
              </div>
            </div>

            <div class="mt-4 pt-3 border-top border-secondary-subtle">
              <button class="btn btn-magic w-100" onclick="generateRecipe()">
                <i class="bi bi-magic me-2"></i> 开始生成食谱
              </button>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="glass-panel p-0 overflow-hidden border-0">
            <div class="recipe-paper" id="recipeBox">
              <div id="idleState" class="empty-state">
                <i class="bi bi-basket3 display-1 mb-3 d-block opacity-50"></i>
                <h4>等待主厨下令...</h4>
                <p class="small">
                  请在左侧勾选您想要处理的食材，<br />AI
                  将为您量身定制美味食谱。
                </p>
              </div>

              <div id="loadingState" class="loading-container d-none">
                <div class="chef-hat"><i class="bi bi-robot"></i></div>
                <h4 class="mt-3 fw-bold text-success">AI 正在思考中...</h4>
                <p class="text-muted">正在分析食材搭配与营养成分</p>
                <div
                  class="progress mt-3"
                  style="width: 200px; height: 6px; margin: 0 auto"
                >
                  <div
                    class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    style="width: 100%"
                  ></div>
                </div>
              </div>

              <div
                id="recipeResult"
                class="recipe-content d-none animate-enter"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/ai_recipe.js"></script>
  </body>
</html>
