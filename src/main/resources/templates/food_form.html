<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>录入食材 - 冰箱守卫者</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #6c5ce7;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.6);
      --input-bg: rgba(240, 243, 248, 0.7);
      --shadow-soft: 0 10px 40px rgba(0,0,0,0.08);
    }

    body {
      background-color: #dfe6e9;
      font-family: "Noto Sans SC", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* === 1. 动态背景 (复用统一风格) === */
    .background-blobs {
      position: absolute; width: 100%; height: 100%; z-index: -1;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6;
      animation: float 12s infinite ease-in-out;
    }
    .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #a29bfe; }
    .blob-2 { bottom: -10%; right: -10%; width: 450px; height: 450px; background: #74b9ff; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, -40px); }
    }

    /* === 2. 玻璃拟态卡片 === */
    .form-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 50px;
      width: 100%;
      max-width: 650px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      animation: zoomIn 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    /* 装饰性光条 */
    .form-card::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, #6c5ce7, #00cec9);
    }

    /* === 3. 标题区域 === */
    .header-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 2rem;
      margin: 0 auto 20px;
      box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
      transform: rotate(-5deg);
    }

    /* === 4. 输入框美化 === */
    .form-label {
      font-weight: 600;
      color: #636e72;
      font-size: 0.9rem;
      margin-left: 5px;
      margin-bottom: 8px;
    }

    .custom-input {
      background: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 12px 20px;
      font-size: 1rem;
      transition: all 0.3s;
      color: #2d3436;
    }

    .custom-input:focus {
      background: #fff;
      border-color: #6c5ce7;
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
      outline: none;
    }

    .input-group-text {
      background: transparent;
      border: none;
      color: #b2bec3;
    }

    /* === 5. 按钮组 === */
    .btn-submit {
      background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      border: none;
      padding: 15px;
      border-radius: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 8px 15px rgba(108, 92, 231, 0.25);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(108, 92, 231, 0.35);
    }

    .btn-back {
      color: #b2bec3;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-back:hover {
      color: #636e72;
      transform: translateX(-5px);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="background-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="container">
  <div class="form-card mx-auto">
    <div class="text-center mb-5">
      <div class="header-icon">
        <i class="bi bi-basket2-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">录入新食材</h3>
      <p class="text-muted small">让守卫者帮您记住每一份新鲜</p>
    </div>

    <form id="addFoodForm">
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-tag-fill me-2 text-primary"></i>食材名称</label>
        <div class="input-group">
          <input type="text" name="name" class="form-control custom-input" placeholder="例如：澳洲西冷牛排" required>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-grid-fill me-2 text-info"></i>所属分类</label>
          <select name="categoryId" id="categorySelect" class="form-select custom-input" required>
            <option value="" disabled selected>请选择分类...</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-geo-alt-fill me-2 text-danger"></i>存放位置</label>
          <select name="storageLocation" class="form-select custom-input">
            <option value="FRIDGE">❄️ 冷藏区 (Fridge)</option>
            <option value="FREEZER">🧊 冷冻区 (Freezer)</option>
            <option value="PANTRY">🏠 常温区 (Pantry)</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-5">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-layers-fill me-2 text-success"></i>数量/单位</label>
          <div class="input-group">
            <input type="number" name="quantity" class="form-control custom-input" value="1" min="0.1" step="0.1" style="flex: 0 0 40%;">
            <input type="text" name="unit" class="form-control custom-input" placeholder="单位 (个/盒)" style="border-left: none;">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-calendar-event-fill me-2 text-warning"></i>过期日期</label>
          <input type="date" name="expiryDate" class="form-control custom-input">
          <div class="form-text ms-2 text-muted" style="font-size: 0.75rem;">
            <i class="bi bi-info-circle"></i> 不填则按分类默认自动计算
          </div>
        </div>
      </div>

      <div class="d-grid gap-3">
        <button type="submit" class="btn btn-primary btn-submit text-white">
          <i class="bi bi-check-lg me-2"></i> 确认存入冰箱
        </button>
        <div class="text-center mt-2">
          <a href="/food/list-page" class="btn btn-link text-decoration-none btn-back">
            <i class="bi bi-arrow-left"></i> 取消，返回列表
          </a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  // 1. Token 校验守门员
  const token = localStorage.getItem("fg_token");
  if (!token) {
    window.location.href = "/login";
  }

  // 2. 默认日期逻辑
  document.addEventListener("DOMContentLoaded", function () {
    const today = new Date().toISOString().split("T")[0];
    // 如果你想让默认过期时间为空(让后台自动算)，可以注释掉下面这行
    // document.querySelector('input[name="expiryDate"]').value = today;
  });

  // 3. 初始化分类下拉框 (带 Token)
  fetch("/api/food/categories", {
    headers: { "Authorization": token }
  })
          .then((res) => {
            if (res.status === 401) window.location.href = "/login";
            return res.json();
          })
          .then((res) => {
            if (res && res.data) {
              const select = document.getElementById("categorySelect");
              res.data.forEach((c) => {
                // 给分类加个 Emoji 图标 (模拟)
                const iconMap = {'蔬菜': '🥬', '肉类': '🥩', '水果': '🍎', '海鲜': '🐟', '饮品': '🥤'};
                const icon = iconMap[c.name] || '📦';

                const opt = new Option(`${icon} ${c.name}`, c.id);
                select.add(opt);
              });
            }
          });

  // 4. 提交表单 (带 Token)
  document.getElementById("addFoodForm").onsubmit = function (e) {
    e.preventDefault();

    // 添加加载动画
    const btn = document.querySelector('.btn-submit');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> 正在存入...';

    const data = Object.fromEntries(new FormData(this));
    data.purchaseDate = new Date().toISOString().split("T")[0];

    fetch("/api/food/add", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": token
      },
      body: JSON.stringify(data),
    })
            .then((res) => res.json())
            .then((res) => {
              if (res.code === 200) {
                // 成功特效
                btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> 存入成功！';
                btn.classList.add('bg-success');
                setTimeout(() => {
                  window.location.href = "/food/list-page";
                }, 800);
              } else {
                alert(res.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
              }
            })
            .catch(err => {
              alert("网络错误");
              btn.disabled = false;
              btn.innerHTML = originalText;
            });
  };
</script>
</body>
</html>
