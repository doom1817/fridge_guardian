<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>添加食材 - 冰箱守卫者</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        font-family: "Noto Sans SC", sans-serif;
      }
      .form-card {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 60px auto;
      }
      .form-label {
        font-weight: 600;
        color: #4b6584;
        margin-left: 5px;
      }
      .form-control,
      .form-select {
        border-radius: 12px;
        border: 1px solid #eee;
        padding: 12px;
        transition: all 0.3s;
      }
      .form-control:focus {
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        border-color: #667eea;
      }
      .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 15px;
        padding: 12px;
        font-weight: 700;
        transition: all 0.3s;
      }
      .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <div class="text-center mb-4">
          <div class="display-6 text-primary mb-2">
            <i class="bi bi-plus-circle-dotted"></i>
          </div>
          <h3 class="fw-bold">新增食材档案</h3>
          <p class="text-muted small">完善信息，让守卫者更好地为您服务</p>
        </div>

        <form id="addFoodForm">
          <div class="mb-3">
            <label class="form-label">食材名称</label>
            <input
              type="text"
              name="name"
              class="form-control"
              placeholder="如：澳洲西冷牛排"
              required
            />
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">食材分类</label>
              <select
                name="categoryId"
                id="categorySelect"
                class="form-select"
                required
              >
                <option value="">选择分类</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">存储位置</label>
              <select name="storageLocation" class="form-select">
                <option value="FRIDGE">冷藏 (Fridge)</option>
                <option value="FREEZER">冷冻 (Freezer)</option>
                <option value="PANTRY">常温 (Pantry)</option>
              </select>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">数量</label>
              <input
                type="number"
                name="quantity"
                class="form-control"
                value="1"
                min="0.01"
                step="0.01"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label">单位</label>
              <input
                type="text"
                name="unit"
                class="form-control"
                placeholder="个/斤/袋"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">保质期至</label>
            <input type="date" name="expiryDate" class="form-control" />
            <small class="text-muted ms-1 mt-1 d-block"
              >如果不填写，将根据分类默认天数自动计算</small
            >
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-submit">
              确认存入冰箱
            </button>
            <a
              href="/food/list-page"
              class="btn btn-link text-muted text-decoration-none"
              >取消并返回</a
            >
          </div>
        </form>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("fg_token");
      if (!token) window.location.href = "/login";
      // 设置保质期默认为今天
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelector('input[name="expiryDate"]').value = new Date().toISOString().split("T")[0];
      });

      // 初始化分类
      fetch("/api/food/categories",{
        headers: { "Content-Type": "application/json","Authorization": token },
      })
        .then((res) => {
            if (res.token === 401){
              window.location.href = "/login";
              return;
          }
          return res.json();
        })
        .then((res) => {
          if (res && res.data) {
            const select = document.getElementById("categorySelect");
            res.data.forEach((c) => {
              const opt = new Option(c.name, c.id);
              select.add(opt);
            });
          }
        });

      document.getElementById("addFoodForm").onsubmit = function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this));
        data.purchaseDate = new Date().toISOString().split("T")[0];

        fetch("/api/food/add", {
          method: "POST",
          headers: { "Content-Type": "application/json","Authorization": token },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.code === 200) window.location.href = "/food/list-page";
          });
      };
    </script>
  </body>
</html>
