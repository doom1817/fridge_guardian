<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录 - 冰箱守卫者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .btn-primary { background: #667eea; border: none; }
    </style>
</head>
<body>
<div class="login-card">
    <h3 class="text-center fw-bold mb-4">🧊 冰箱守卫者</h3>
    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
        <li class="nav-item w-50" role="presentation">
            <button class="nav-link active w-100" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button">登录</button>
        </li>
        <li class="nav-item w-50" role="presentation">
            <button class="nav-link w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button">注册</button>
        </li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="login-pane">
            <form onsubmit="doLogin(event)">
                <div class="mb-3"><input type="text" id="l_username" class="form-control" placeholder="用户名" required></div>
                <div class="mb-3"><input type="password" id="l_password" class="form-control" placeholder="密码" required></div>
                <button type="submit" class="btn btn-primary w-100 py-2">进入系统</button>
            </form>
        </div>
        <div class="tab-pane fade" id="register-pane">
            <form onsubmit="doRegister(event)">
                <div class="mb-3"><input type="text" id="r_username" class="form-control" placeholder="设置用户名" required></div>
                <div class="mb-3"><input type="password" id="r_password" class="form-control" placeholder="设置密码" required></div>
                <div class="mb-3"><input type="email" id="r_email" class="form-control" placeholder="邮箱 (选填)"></div>
                <button type="submit" class="btn btn-outline-primary w-100 py-2">立即注册</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "/api/auth";

    async function doLogin(e) {
        e.preventDefault();
        const username = document.getElementById("l_username").value;
        const password = document.getElementById("l_password").value;

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();
            if (result.code === 200) {
                // 核心：保存 Token
                localStorage.setItem("fg_token", result.data.token);
                localStorage.setItem("fg_user", result.data.username);
                window.location.href = "/";
            } else {
                alert(result.message);
            }
        } catch (err) { alert("网络错误"); }
    }

    async function doRegister(e) {
        e.preventDefault();
        const username = document.getElementById("r_username").value;
        const password = document.getElementById("r_password").value;
        const email = document.getElementById("r_email").value;

        const res = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email })
        });
        const result = await res.json();
        if (result.code === 200) {
            alert("注册成功，请切换到登录页登录");
            document.getElementById("login-tab").click();
        } else {
            alert(result.message);
        }
    }
</script>
</body>
</html>
