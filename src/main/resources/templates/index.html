<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>冰箱守卫者 - 智能食材管理</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="/css/index.css" rel="stylesheet" />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <div class="hero-section animate-enter">
      <div class="container">
        <h1 class="display-4 app-title">
          <i class="bi bi-snow2"></i> 冰箱守卫者
        </h1>
        <p class="text-muted mb-4" style="font-size: 1.1rem">
          让每一份食材都发挥它的价值，拒绝浪费。
        </p>

        <div class="d-inline-flex align-items-center glass-pill">
          <i class="bi bi-person-circle me-2"></i>
          <span id="currentUser" class="me-3">未登录</span>
          <button
            onclick="doLogout()"
            class="btn btn-link p-0 text-decoration-none text-danger"
            style="font-size: 0.9rem"
          >
            <i class="bi bi-box-arrow-right"></i> 退出
          </button>
        </div>
      </div>
    </div>

    <div class="container mb-5">
      <div class="row g-4 mb-5">
        <div class="col-md-3 animate-enter delay-1">
          <div class="glass-card p-4 position-relative overflow-hidden">
            <div class="stat-icon-box bg-gradient-red">
              <i class="bi bi-alarm-fill"></i>
            </div>
            <h6
              class="text-muted text-uppercase fw-bold"
              style="font-size: 0.8rem"
            >
              临期提醒
            </h6>
            <div class="d-flex align-items-end justify-content-between">
              <h2 class="fw-bold mb-0 text-danger" id="expiringCount">0</h2>
              <small class="badge bg-danger-subtle text-danger rounded-pill"
                >需处理</small
              >
            </div>
          </div>
        </div>

        <div class="col-md-3 animate-enter delay-2">
          <div class="glass-card p-4">
            <div class="stat-icon-box bg-gradient-blue">
              <i class="bi bi-plus-lg"></i>
            </div>
            <h6
              class="text-muted text-uppercase fw-bold"
              style="font-size: 0.8rem"
            >
              快速操作
            </h6>
            <div class="mt-3">
              <a
                href="/food/add-page"
                class="btn btn-primary btn-glow w-100 bg-gradient-blue border-0 shadow-sm"
              >
                录入食材
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-3 animate-enter delay-3">
          <div class="glass-card p-4">
            <div class="stat-icon-box bg-gradient-teal">
              <i class="bi bi-stars"></i>
            </div>
            <h6
              class="text-muted text-uppercase fw-bold"
              style="font-size: 0.8rem"
            >
              AI 助手
            </h6>
            <div class="mt-3">
              <a
                href="/ai/recipe-page"
                class="btn btn-success btn-glow w-100 bg-gradient-teal border-0 shadow-sm"
              >
                生成菜谱
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-3 animate-enter delay-4">
          <div class="glass-card p-4">
            <div class="stat-icon-box bg-gradient-purple">
              <i class="bi bi-trophy-fill"></i>
            </div>
            <h6
              class="text-muted text-uppercase fw-bold"
              style="font-size: 0.8rem"
            >
              本月贡献
            </h6>
            <div class="d-flex align-items-end justify-content-between">
              <h2 class="fw-bold mb-0 text-primary" id="totalProcessed">0</h2>
              <small class="text-muted">份食材</small>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4 animate-enter delay-4">
        <div class="col-lg-7">
          <div class="glass-card p-4 h-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-hourglass-split me-2 text-warning"></i> 预警清单
              </h5>
              <a
                href="/food/list-page"
                class="btn btn-sm btn-light rounded-pill px-3 shadow-sm"
              >
                全部库存 <i class="bi bi-arrow-right-short"></i>
              </a>
            </div>

            <div id="emptyState" class="text-center py-5" style="display: none">
              <div class="mb-3">
                <i
                  class="bi bi-check-circle-fill text-success display-4 opacity-50"
                ></i>
              </div>
              <p class="text-muted fw-bold">冰箱很安全，没有临期食材！</p>
            </div>

            <div class="table-responsive">
              <table class="table custom-table align-middle" id="expiringTable">
                <thead>
                  <tr>
                    <th style="width: 40%">食材名称</th>
                    <th>过期时间</th>
                    <th class="text-end">倒计时</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="glass-card p-4 h-100">
            <h5 class="fw-bold mb-4 text-dark">
              <i class="bi bi-pie-chart-fill me-2 text-primary"></i> 消耗分析
            </h5>
            <div id="statisticsChart" style="width: 100%; height: 320px"></div>
          </div>
        </div>

        <div class="row g-4 animate-enter delay-4 mt-2">
          <div class="col-12">
            <h5 class="fw-bold mb-3 text-dark">
              <i class="bi bi-cpu-fill me-2 text-primary"></i> AI 服务监控
            </h5>
          </div>

          <div class="col-lg-8">
            <div class="glass-card p-4 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-muted text-uppercase fw-bold">Token 消耗趋势 (近7天)</h6>
                <span class="badge bg-primary-subtle text-primary" id="totalTokenBadge">总消耗: 0</span>
              </div>
              <div id="tokenTrendChart" style="width: 100%; height: 320px;"></div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="glass-card p-4 h-100">
              <h6 class="text-muted text-uppercase fw-bold mb-4">API 调用成功率</h6>

              <div id="successRateChart" style="width: 100%; height: 200px;"></div>

              <div class="row text-center mt-2">
                <div class="col-6 border-end">
                  <h4 class="fw-bold text-dark mb-0" id="statLatency">0ms</h4>
                  <small class="text-muted" style="font-size: 0.8rem">平均耗时</small>
                </div>
                <div class="col-6">
                  <h4 class="fw-bold text-dark mb-0" id="statFail">0</h4>
                  <small class="text-danger" style="font-size: 0.8rem">失败次数</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
