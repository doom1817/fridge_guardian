<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食材库存 - 冰箱守卫者</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="/css/food_list.css" rel="stylesheet" />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <nav class="navbar-glass">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand fw-bold d-flex align-items-center"
          href="/"
          style="color: #2d3436; font-size: 1.4rem"
        >
          <i class="bi bi-snow2 me-2 text-primary"></i> 冰箱守卫者
        </a>
        <div>
          <a
            href="/"
            class="btn btn-link text-decoration-none text-secondary me-2"
            >返回首页</a
          >
          <a
            href="/food/add-page"
            class="nav-btn nav-btn-primary text-decoration-none"
          >
            <i class="bi bi-plus-lg me-1"></i> 录入食材
          </a>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <div class="glass-panel">
        <div
          class="d-flex flex-wrap justify-content-between align-items-end mb-4"
        >
          <div>
            <h2 class="fw-bold mb-1">我的食材库存</h2>
            <p class="text-muted mb-0">管理您的冰箱，避免浪费每一份新鲜</p>
          </div>
          <div class="text-end">
            <span class="badge bg-light text-dark border p-2 rounded-3">
              共
              <span id="totalCount" class="fw-bold text-primary">0</span> 件物品
            </span>
          </div>
        </div>

        <div class="search-wrapper">
          <i class="bi bi-search search-icon"></i>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="搜索食材名称、位置..."
            onkeyup="filterTable()"
          />
        </div>

        <div class="table-responsive">
          <table class="food-table">
            <thead>
              <tr>
                <th>食材信息</th>
                <th>存储位置</th>
                <th>保质期状态</th>
                <th class="text-end">快捷操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>

          <div id="emptyState" class="text-center py-5 d-none">
            <div class="mb-3">
              <i class="bi bi-box-seam display-1 text-muted opacity-25"></i>
            </div>
            <h5 class="text-muted">冰箱空空如也</h5>
            <p class="text-muted small">快去录入一些新鲜食材吧</p>
            <a
              href="/food/add-page"
              class="btn btn-outline-primary btn-sm rounded-pill mt-2"
              >去录入</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/expiring_alert.js"></script>
    <script src="/js/food_list.js"></script>
  </body>
</html>
